<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RS Informática | Suporte Técnico em Campinas e Região</title>

  <meta
    name="description"
    content="RS Informática: serviços de informática, suporte técnico em TI, manutenção, redes, formatação, backup e suporte remoto em Campinas e cidades próximas."
  >

  <style>
    :root {
      --azul: #0b5fff;
      --azul-escuro: #062a63;
      --cinza: #f4f7fb;
      --texto: #1d2430;
      --branco: #ffffff;
      --verde: #128c45;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    html {
      scroll-padding-top: 140px;
    }

    body {
      color: var(--texto);
      background: var(--branco);
      line-height: 1.6;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--branco);
      box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 0;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--azul-escuro);
      text-decoration: none;
    }

    .logo span {
      color: var(--azul);
    }

    nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      list-style: none;
    }

    nav a {
      text-decoration: none;
      color: var(--texto);
      font-weight: 600;
    }

    nav a:hover {
      color: var(--azul);
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-whatsapp {
      background: var(--verde);
      color: var(--branco);
    }

    .btn-whatsapp:hover {
      background: #0e7137;
    }

    .btn-azul {
      background: var(--azul);
      color: var(--branco);
    }

    .btn-azul:hover {
      background: #0849c9;
    }

    .hero {
      background: linear-gradient(
        120deg,
        var(--azul-escuro),
        var(--azul)
      );
      color: var(--branco);
      padding: 90px 0;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.25;
      max-width: 760px;
      margin-bottom: 22px;
    }

    .hero p {
      max-width: 680px;
      font-size: 1.1rem;
      margin-bottom: 28px;
    }

    .hero-buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .local {
      display: inline-block;
      margin-top: 22px;
      background: rgba(255, 255, 255, .14);
      padding: 10px 16px;
      border-radius: 16px;
      font-weight: 600;
    }

    section {
      padding: 70px 0;
    }

    .titulo {
      text-align: center;
      margin-bottom: 40px;
    }

    .titulo h2 {
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      color: var(--azul-escuro);
    }

    .titulo p {
      color: #57606d;
      max-width: 680px;
      margin: 10px auto 0;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--cinza);
      padding: 28px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }

    .card h3 {
      color: var(--azul-escuro);
      margin-bottom: 10px;
    }

    .card p {
      color: #4c5563;
    }

    .destaque {
      background: var(--cinza);
    }

    .destaque-grid,
    .contato-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 40px;
      align-items: start;
    }

    .destaque h2 {
      color: var(--azul-escuro);
      margin-bottom: 16px;
      font-size: 2rem;
    }

    .destaque ul {
      margin-top: 18px;
      padding-left: 22px;
    }

    .destaque li {
      margin-bottom: 10px;
    }

    .destaque .card {
      background: var(--branco);
    }

    .espaco {
      margin-top: 22px;
    }

    form {
      background: var(--cinza);
      padding: 28px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }
