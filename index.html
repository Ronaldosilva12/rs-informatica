<form action="https://formsubmit.co/ronaldosilva2048@gmail.com" method="POST">
  <label for="nome">Nome</label>
  <input
    type="text"
    id="nome"
    name="nome"
    placeholder="Seu nome completo"
    required
  >

  <label for="email">E-mail</label>
  <input
    type="email"
    id="email"
    name="email"
    placeholder="seuemail@dominio.com"
    required
  >

  <label for="telefone">Telefone / WhatsApp</label>
  <input
    type="tel"
    id="telefone"
    name="telefone"
    placeholder="(19) 99999-9999"
    required
  >

  <label for="cidade">Cidade</label>
  <input
    type="text"
    id="cidade"
    name="cidade"
    placeholder="Campinas ou outra cidade"
    required
  >

  <label for="servico">Serviço desejado</label>
  <input
    type="text"
    id="servico"
    name="servico"
    placeholder="Ex.: formatação, rede, suporte remoto"
    required
  >

  <label for="mensagem">Mensagem</label>
  <textarea
    id="mensagem"
    name="mensagem"
    placeholder="Descreva o problema ou o serviço que você precisa."
    required
  ></textarea>

  <input
    type="hidden"
    name="_subject"
    value="Nova solicitação pelo site - RS Informática"
  >

  <input
    type="hidden"
    name="_next"
    value="https://rsinformatica.netlify.app/obrigado.html"
  >

  <input type="hidden" name="_captcha" value="false">

  <button class="btn btn-azul" type="submit">
    Enviar mensagem por e-mail
  </button>
</form>
