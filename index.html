<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RS Informática | Suporte Técnico em Campinas</title>
  <meta name="description" content="Suporte técnico em TI, manutenção de computadores, formatação, redes, backup e suporte remoto. RS Informática em Campinas e cidades próximas.">

  <style>
    :root {
      --azul: #0b5fff;
      --escuro: #062a63;
      --verde: #128c45;
      --fundo: #f4f7fb;
      --texto: #1d2430;
      --borda: #dce4ef;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 140px;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--texto);
      background: #fff;
      line-height: 1.65;
    }

    a { color: var(--azul); }

    button, input, select, textarea { font: inherit; }

    a:focus-visible, button:focus-visible,
    input:focus-visible, select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #ffbf47;
      outline-offset: 4px;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      box-shadow: 0 2px 12px #00000012;
    }

    .cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 0;
    }

    .logo {
      color: var(--escuro);
      font-size: 1.5rem;
      font-weight: 800;
      text-decoration: none;
    }

    .logo span { color: var(--azul); }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    nav a {
      color: var(--texto);
      text-decoration: none;
      font-weight: 600;
    }

    nav a:hover { color: var(--azul); }

    .botao {
      display: inline-block;
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--azul);
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .botao:hover { background: #0849c9; }

    .whatsapp { background: var(--verde); }
    .whatsapp:hover { background: #0e7137; }

    .claro {
      color: var(--escuro);
      background: #fff;
    }

    .claro:hover { background: #e7eef9; }

    .hero {
      padding: 80px 0;
      color: #fff;
      background: linear-gradient(120deg, var(--escuro), var(--azul));
    }

    .hero h1 {
      max-width: 800px;
      margin: 0 0 22px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.2;
    }

    .hero p {
      max-width: 720px;
      margin: 0 0 26px;
      font-size: 1.1rem;
    }

    .acoes {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .local {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 16px;
      border-radius: 12px;
      background: #ffffff20;
      font-size: .95rem;
    }

    section { padding: 65px 0; }

    h2 {
      margin: 0 0 14px;
      color: var(--escuro);
      font-size: clamp(1.7rem, 4vw, 2.2rem);
      line-height: 1.3;
    }

    h3 {
      margin: 0 0 12px;
      color: var(--escuro);
    }

    .titulo {
      max-width: 720px;
      margin: 0 auto 35px;
      text-align: center;
    }
